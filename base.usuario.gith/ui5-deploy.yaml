# yaml-language-server: $schema=https://sap.github.io/ui5-tooling/schema/ui5.yaml.json

specVersion: "4.0"
metadata:
  name: com.moovi.zui5.usuario.base.conhecimento.gds
type: application
builder:
  resources:
    excludes:
      - /test/**
      - /localService/**
  customTasks:
    - name: deploy-to-abap
      afterTask: generateCachebusterInfo
      configuration:
        target:
          url: https://seu-host:porta
          client: '000'
        app:
          name: ZGDS_BC_USERS
          description: Base Conhecimento Usuário
          package: ZGDS
          transport: XXXK900000
        exclude:
          - /test/
          - /localService/
